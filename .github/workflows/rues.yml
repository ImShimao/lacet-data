name: Rues

# Les rues d'Europe de l'Ouest, découpées en archives. Voir le README.
#
# Une fois par mois : les rues d'un quartier ne changent pas d'une semaine à
# l'autre, et l'app sert de toute façon une tuile de moins de trois mois avant
# de la rafraîchir elle-même.
#
# Les zones à fabriquer sont décrites dans `zones.json`, une par pays ou région.
# Chacune porte son emprise et la liste des extraits qui la couvrent — **ses
# voisins compris**, sans quoi les tuiles du bord n'auraient que la moitié de
# leurs rues. Les tuiles se rangent toutes dans la même grille mondiale : deux
# zones voisines ne se marchent pas dessus, et on peut en ajouter une sans
# refaire les autres.
on:
  schedule:
    - cron: '0 3 2 * *'
  workflow_dispatch:
    inputs:
      zones:
        description: "Zones à fabriquer, séparées par des virgules. Vide = toutes."
        required: false
        default: ''

concurrency: rues

permissions:
  contents: write

jobs:
  rues:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      # Le chevauchement des bandes de découpage : une tuile ne doit jamais
      # tomber sur une couture.
      OVERLAP: 0.15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Outils
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          pip install --quiet osmium
          # Le disque de travail : le dépôt vit sur une partition de 14 Go, trop
          # juste pour une dizaine d'extraits nationaux.
          sudo mkdir -p /mnt/rues/sources /mnt/rues/tuiles
          sudo chown -R "$USER" /mnt/rues
          df -h / /mnt | tail -2

      - name: Extraits OpenStreetMap
        run: |
          set -euo pipefail
          cd /mnt/rues
          # Chaque extrait n'est téléchargé qu'une fois, même s'il sert à
          # plusieurs zones : l'Allemagne pèse quatre gigaoctets.
          python - "$GITHUB_WORKSPACE/zones.json" "${{ github.event.inputs.zones }}" <<'PY' > sources.txt
          import json, sys
          voulues = {z.strip() for z in sys.argv[2].split(',') if z.strip()}
          zones = json.load(open(sys.argv[1]))
          besoin = []
          for z in zones:
              if voulues and z['nom'] not in voulues:
                  continue
              for s in z['sources']:
                  if s not in besoin:
                      besoin.append(s)
          print('\n'.join(besoin))
          PY
          wc -l < sources.txt

          while read -r zone; do
            nom="$(echo "$zone" | tr '/' '-')"
            echo "::group::$zone"
            curl -sSfL -o "sources/$nom.osm.pbf" "https://download.geofabrik.de/${zone}-latest.osm.pbf"
            ls -lh "sources/$nom.osm.pbf"
            echo "::endgroup::"
          done < sources.txt
          df -h /mnt | tail -1

      - name: Découpage en tuiles
        run: |
          set -euo pipefail
          cd /mnt/rues

          python - "$GITHUB_WORKSPACE/zones.json" "${{ github.event.inputs.zones }}" <<'PY' > plan.txt
          import json, sys
          voulues = {z.strip() for z in sys.argv[2].split(',') if z.strip()}
          zones = json.load(open(sys.argv[1]))
          for z in zones:
              if voulues and z['nom'] not in voulues:
                  continue
              sources = ' '.join(s.replace('/', '-') for s in z['sources'])
              print(f"{z['nom']}\t{z['bbox']}\t{z['bandes']}\t{sources}")
          PY
          cat plan.txt

          while IFS=$'\t' read -r nom bbox bandes sources; do
            echo "::group::$nom"
            rm -f part-*.osm.pbf zone.osm.pbf

            # Les extraits, coupés à l'emprise de la zone et fusionnés. Les
            # objets présents des deux côtés d'une frontière ne sont gardés
            # qu'une fois.
            n=0
            for s in $sources; do
              n=$((n + 1))
              osmium extract --bbox "$bbox" --set-bounds --overwrite \
                -o "part-$n.osm.pbf" "sources/$s.osm.pbf"
            done
            osmium merge --overwrite -o zone.osm.pbf part-*.osm.pbf
            rm -f part-*.osm.pbf
            ls -lh zone.osm.pbf

            # La sélection : le rectangle de la zone. Les tuiles de la mer sont
            # gardées comme les autres — rien au-delà ne manque.
            python - "$bbox" > zone.poly <<'PY'
          import sys
          w, s, e, n = (float(v) for v in sys.argv[1].split(','))
          print("zone")
          print("1")
          for lon, lat in ((w, s), (e, s), (e, n), (w, n), (w, s)):
              print(f"   {lon:.7E}   {lat:.7E}")
          print("END")
          print("END")
          PY

            IFS=, read -r W S E N <<< "$bbox"
            python - "$S" "$N" "$bandes" "$OVERLAP" > bandes.txt <<'PY'
          import sys
          s, n, bandes, overlap = float(sys.argv[1]), float(sys.argv[2]), int(sys.argv[3]), float(sys.argv[4])
          pas = (n - s) / bandes
          for k in range(bandes):
              print(f"{max(s, s + k * pas - overlap):.4f} {min(n, s + (k + 1) * pas + overlap):.4f}")
          PY

            k=0
            while read -r bs bn; do
              k=$((k + 1))
              echo "bande $k : $bs → $bn"
              osmium extract --bbox "$W,$bs,$E,$bn" --set-bounds --overwrite -o bande.osm.pbf zone.osm.pbf
              # `--source-bbox=` et non `--source-bbox ` : une longitude négative
              # commence par un tiret, et serait prise pour une option.
              python "$GITHUB_WORKSPACE/scripts/region_tiles.py" \
                bande.osm.pbf zone.poly tuiles --name "$nom $k" --source-bbox="$W,$bs,$E,$bn"
              rm -f bande.osm.pbf
            done < bandes.txt

            rm -f zone.osm.pbf tuiles/index.json
            echo "$(ls tuiles | wc -l) tuiles au total"
            echo "::endgroup::"
          done < plan.txt

          du -sh tuiles

      - name: Archives
        run: |
          set -euo pipefail
          cd /mnt/rues
          rm -rf sources
          python "$GITHUB_WORKSPACE/scripts/pack_tiles.py" tuiles packs --name "Europe de l'Ouest"
          du -sh packs
          # Sans `|| true`, `head` ferme le tuyau, `ls` s'en plaint, et
          # `pipefail` jette des heures de fabrication pour un aperçu.
          ls -lh packs | head -5 || true

      - name: Publication
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          rm -rf packs
          cp -r /mnt/rues/packs packs
          nouvelles="$(ls packs | wc -l)"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # **Une zone seule s'ajoute, elle ne remplace pas tout.** Sans ça,
          # fabriquer la Suisse effacerait la France du dépôt. On repart donc de
          # ce qui est publié, et on pose les nouvelles archives par-dessus —
          # seules les tuiles refaites voyagent.
          #
          # La fabrication complète, elle, repart d'une branche neuve : sinon
          # l'historique garderait chaque mois des gigaoctets que personne ne
          # relira.
          if [ -n "${{ github.event.inputs.zones }}" ]; then
            git fetch -q --depth 1 origin main
            git checkout -q -B publication FETCH_HEAD
            cp -r /mnt/rues/packs/. packs/
          else
            git checkout --orphan publication
            git reset -q
          fi

          # Les outils d'abord, les archives ensuite et **par lots** : GitHub
          # refuse une poussée de plus de deux gigaoctets. Chaque lot est un
          # envoi de quelques centaines de mégaoctets, ce qui repart aussi plus
          # facilement après une coupure.
          jour="$(date -u +%Y-%m-%d)"
          git add -A -- . ':!packs'
          git commit -q -m "Outils du $jour"
          git push -q -f origin publication

          ls packs > /tmp/archives.txt
          split -l 50 /tmp/archives.txt /tmp/lot-
          for lot in /tmp/lot-*; do
            while read -r nom; do git add "packs/$nom"; done < "$lot"
            git commit -q -m "Rues du $jour ($(basename "$lot"))"
            git push -q origin publication
          done

          git push -f origin publication:main
          du -sh packs
          echo "$nouvelles archives fabriquées, $(ls packs | wc -l) fichiers publiés au total"
